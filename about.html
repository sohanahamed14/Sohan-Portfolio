<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>About — Sohan Ahammed | CV</title>
  <meta name="description"
    content="Sohan Ahammed's CV — Full Stack Developer & AI Engineer. View qualifications, experience, and skills." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #000000;
      --color-orange: #e8530e;
    }

    html {
      font-size: 62.5%;
    }

    body {
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Back navigation bar */
    .about-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2.4rem;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .about-nav .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    .about-nav .back-link:hover {
      color: var(--color-orange);
    }

    .about-nav .back-link svg {
      width: 18px;
      height: 18px;
    }

    .about-nav .page-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-orange);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* CV Image Container */
    .cv-container {
      margin-top: 60px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .cv-container img {
      display: block;
      width: 2300px;
      height: 3253px;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <!-- Fixed top bar with back link -->
  <nav class="about-nav">
    <a href="./index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Portfolio</span>
    </a>
    <span class="page-title">◆ ABOUT / CV</span>
  </nav>

  <!-- CV Image at original resolution -->
  <div class="cv-container">
    <img src="./Sohan CV.jpg" alt="Sohan Ahammed — Curriculum Vitae" width="2300" height="3253" />
  </div>
</body>

</html>
