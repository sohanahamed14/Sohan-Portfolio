<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Certificate — SQL (Intermediate) | Sohan Ahammed</title>
  <meta name="description"
    content="REFCERT-003 — SQL (Intermediate) certificate from HackerRank, earned by Sohan Ahammed in 2024." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #000000;
      --color-orange: #e8530e;
    }

    html {
      font-size: 62.5%;
    }

    body {
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Back navigation bar */
    .about-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2.4rem;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .about-nav .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    .about-nav .back-link:hover {
      color: var(--color-orange);
    }

    .about-nav .back-link svg {
      width: 18px;
      height: 18px;
    }

    .about-nav .page-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-orange);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .about-nav .nav-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .about-nav .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.2rem;
      background: linear-gradient(135deg, #ff6b35 0%, #f4511e 100%);
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      box-shadow: 0 4px 16px rgba(255, 87, 34, 0.4), inset 1px 1px 1.5px rgba(255, 255, 255, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .about-nav .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 87, 34, 0.6), inset 1px 1px 1.5px rgba(255, 255, 255, 0.35);
    }

    .about-nav .btn-download svg {
      width: 16px;
      height: 16px;
    }

    /* CV Image Container */
    .cv-container {
      margin-top: 60px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .cv-container img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <!-- Fixed top bar with back link -->
  <nav class="about-nav">
    <a href="./index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Portfolio</span>
    </a>
    <div class="nav-right">
      <a href="./Hackerrank3.jpg" download="HackerRank_SQL_Certificate.jpg" class="btn-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download</span>
      </a>
      <span class="page-title">◆ REFCERT-003</span>
    </div>
  </nav>

  <!-- Certificate Image at original resolution -->
  <div class="cv-container">
    <img src="./Hackerrank3.jpg" alt="HackerRank — SQL (Intermediate) Certificate" />
  </div>
</body>

</html>
